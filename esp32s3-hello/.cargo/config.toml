[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
linker = "/usr/local/bin/graft"
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["alloc", "core"]

[env]
ESP_LOG = "INFO"
# No TLS runtime on bare-metal xtensa, and esp-hal's linkall.x has no
# *(.tdata*) rule — ld orphan-places graft's TLS slack into the IROM
# LOAD, flipping it writable, and the ROM bootloader rejects the image
# (boot crash-loop, found on hardware). Opt out of TLS slack entirely;
# graft's base mode fails loud if any slack section gets orphaned.
GRAFT_TLS_SLACK_LEN = "0"
# graft's passthrough mode forwards all argv to the real linker. For
# xtensa builds the gcc driver (not bare ld) is what rustc expects to
# invoke — it knows how to add the right libgcc / startfiles / linker
# scripts. See graft/src/main.rs:passthrough.
GRAFT_REAL_LD = "xtensa-esp32s3-elf-gcc"
