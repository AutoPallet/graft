[package]
name = "esp32s3-hello"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "esp32s3-hello"
path = "src/main.rs"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
overflow-checks = false

[profile.dev]
opt-level = "s"
debug = 2
debug-assertions = true
overflow-checks = true

# Fast link/check on the host so cargo metadata doesn't trip on host arch.
# Build is locked to xtensa-esp32s3-none-elf via .cargo/config.toml.
