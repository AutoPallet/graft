[package]
name = "graft"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Incremental linker: relinks only what an edit changed and splices it into the previous binary"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "graft"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ar = "0.9"
blake3.workspace = true
object.workspace = true
postcard.workspace = true
rayon = "1.12.0"
rustc-hash = "2.1.2"
serde.workspace = true

[dev-dependencies]
tempfile = "3"
